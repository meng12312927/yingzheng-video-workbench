services:
  app:
    build: .
    command: ["python", "run.py", "--ui"]
    env_file: [.env]
    environment:
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7860
      MOBILE_REVIEW_BASE_URL: http://localhost:7961
      DATABASE_URL: postgresql://yingzheng:yingzheng@postgres:5432/yingzheng
      REDIS_URL: redis://redis:6379/0
    ports: ["7860:7860"]
    volumes:
      - ./output:/app/output
      - model-cache:/root/.cache
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  mobile-review:
    build: .
    command: ["python", "run.py", "--mobile-review"]
    env_file: [.env]
    environment:
      MOBILE_REVIEW_PORT: 7961
    ports: ["7961:7961"]
    volumes:
      - ./output:/app/output
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7961/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yingzheng
      POSTGRES_USER: yingzheng
      POSTGRES_PASSWORD: yingzheng
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yingzheng -d yingzheng"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  model-cache:
  postgres-data:
  redis-data:
